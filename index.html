<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وەرگێڕی کوردی بۆ ئەڵمانی - ZicoAghaDizayee</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 5px;
        }
        .author {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>وەرگێڕی کوردی - ئەڵمانی</h2>
        <div class="author">By: ZicoAghaDizayee</div>
        <textarea id="inputText" placeholder="دەق بە کوردی لێرە بنووسە..."></textarea>
        <button onclick="openGoogleTranslate()">وەربگێڕە لە ڕێگەی گووگڵ</button>
    </div>

    <script>
        function openGoogleTranslate() {
            const text = document.getElementById('inputText').value.trim();
            
            if (!text) {
                alert("تکایە دەقێک بنووسە!");
                return;
            }

            // کردنەوەی ڕاستەوخۆی گووگڵ ترەنسڵات بە دەقەکەی تۆوە بە بێ کێشە
            const googleUrl = `https://translate.google.com/?sl=ku&tl=de&text=${encodeURIComponent(text)}&op=translate`;
            window.open(googleUrl, '_blank');
        }
    </script>

</body>
</html>
