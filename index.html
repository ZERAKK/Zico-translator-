<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وەرگێڕی کوردی بۆ ئەڵمانی - ZicoAghaDizayee</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 22px;
        }
        .author {
            text-align: center;
            color: #7f8c8d;
            font-size: 13px;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        label {
            font-size: 14px;
            color: #34495e;
            margin-bottom: 6px;
            font-weight: 600;
        }
        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
            transition: border 0.3s;
        }
        textarea:focus {
            border-color: #4cd137;
        }
        #outputText {
            background-color: #f8f9fa;
            color: #2f3640;
            direction: ltr;
            text-align: left;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }
        button {
            flex: 1;
            background-color: #4cd137;
            color: white;
            padding: 12px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s, transform 0.1s;
        }
        button:hover {
            background-color: #44bd32;
        }
        button:active {
            transform: scale(0.98);
        }
        .copy-btn {
            background-color: #fbc531;
        }
        .copy-btn:hover {
            background-color: #e1b12c;
        }
        .status {
            text-align: center;
            font-size: 13px;
            color: #e84118;
            margin-top: 8px;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>وەرگێڕی کوردی بۆ ئەڵمانی</h2>
        <div class="author">By: ZicoAghaDizayee</div>

        <label for="inputText">دەقی کوردی (سۆرانی):</label>
        <textarea id="inputText" placeholder="لێرە دەق بنووسە..."></textarea>

        <div class="btn-group">
            <button onclick="translateText()">وەربگێڕە</button>
            <button class="copy-btn" onclick="copyResult()">کۆپیکردن</button>
        </div>

        <label for="outputText" style="margin-top: 15px;">وەرگێڕانی ئەڵمانی:</label>
        <textarea id="outputText" placeholder="Übersetzung..." readonly></textarea>
        
        <div id="statusMsg" class="status"></div>
    </div>

    <script>
        async function translateText() {
            const text = document.getElementById('inputText').value.trim();
            const outputField = document.getElementById('outputText');
            const statusMsg = document.getElementById('statusMsg');
            
            if (!text) {
                statusMsg.textContent = "تکایە سەرەتا دەقێک بنووسە!";
                outputField.value = "";
                return;
            }

            statusMsg.textContent = "چاوەڕوان بە، وەرگێڕان ئەنجام دەدرێت...";
            outputField.value = "";

            try {
                // بەکارهێنانی سیستەمی مۆدێرنی وەرگێڕانی پاک
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ku|de`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data && data.responseData && data.responseData.translatedText) {
                    outputField.value = data.responseData.translatedText;
                    statusMsg.textContent = "";
                } else {
                    statusMsg.textContent = "هەڵەیەک ڕوویدا، دووبارە هەوڵ بدەرەوە.";
                }
            } catch (error) {
                statusMsg.textContent = "کێشە لە پەیوەندی ئینتەرنێت هەیە.";
            }
        }

        function copyResult() {
            const outputField = document.getElementById('outputText');
            const statusMsg = document.getElementById('statusMsg');
            
            if (!outputField.value) {
                statusMsg.textContent = "هیچ دەقێک نییە بۆ کۆپیکردن!";
                return;
            }

            navigator.clipboard.writeText(outputField.value);
            statusMsg.style.color = "#4cd137";
            statusMsg.textContent = "دەقەکە کۆپیکرا بۆ حافظە!";
            
            setTimeout(() => {
                statusMsg.textContent = "";
                statusMsg.style.color = "#e84118";
            }, 2500);
        }
    </script>

</body>
</html>
