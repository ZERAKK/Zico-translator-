<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وەرگێڕی کوردی بۆ ئەڵمانی - ZicoAghaDizayee</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 5px;
        }
        .author {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 15px;
        }
        button:hover {
            background-color: #45a049;
        }
        #outputText {
            background-color: #f9f9f9;
            color: #333;
            direction: ltr;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>وەرگێڕی کوردی - ئەڵمانی</h2>
        <div class="author">By: ZicoAghaDizayee</div>
        <textarea id="inputText" placeholder="دەق بە کوردی لێرە بنووسە..."></textarea>
        <button onclick="translateText()">وەرگێڕان</button>
        <textarea id="outputText" placeholder="Übersetzung hier..." readonly></textarea>
    </div>

    <script>
        async function translateText() {
            const text = document.getElementById('inputText').value.trim();
            const outputField = document.getElementById('outputText');
            
            if (!text) {
                outputField.value = "تکایە دەقێک بنووسە!";
                return;
            }

            outputField.value = "چاوەڕوان بە...";

            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ku|de`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data && data.responseData && data.responseData.translatedText) {
                    outputField.value = data.responseData.translatedText;
                } else {
                    outputField.value = "هەڵەیەک ڕوویدا لە وەرگێڕان.";
                }
            } catch (error) {
                outputField.value = "کێشە لە پەیوەندی ئینتەرنێت هەیە.";
            }
        }
    </script>

</body>
</html>
